<input type="number" id="peso" placeholder="peso">
<input type="number" id="altura" placeholder="altura en metros ej: 1.70">
<button onclick="mi_funcion()">calcular</button>
<br>
<img id="imagen_imc" src="./tendor.jpg" width="155">

<script>
  function mi_funcion(){
    var mi_imc = peso.value / (altura.value * altura.value);
    
    if (mi_imc < 25) {
        imagen_imc.src = "./tendor.jpg";
    }
    if (mi_imc >= 25 && mi_imc < 40) {
        imagen_imc.src = "./mamado.jpg";
    }
    if (mi_imc >= 40) {
        imagen_imc.src = "./gordito.jpg";
    }
  }
</script>
